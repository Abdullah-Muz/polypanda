name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Fetch pinned Panda model
        run: scripts/fetch_assets.sh
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Verify install
        run: uv run python scripts/verify_install.py --steps 10000
      - name: Test
        run: uv run pytest
