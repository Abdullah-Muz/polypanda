# v3 step d2: stand a lying cube, held across its width, upright on the table (StandUpEnv).
# Starts from the cell's carry posture over the spot; the workcell's gripper and grasp assist;
# a tower of 1-4 cubes about 23 cm from the spot in most episodes, as at the staging spots.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75          # rad (100 deg) from pointing down: the turned hand needs 90
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3         # training only

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26            # 15 deg (the cell's soft grasp-assist weld lets the cube lag)
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

gripper:                    # as simulation.workcell.WorkcellConfig
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:              # training only
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
