# v3 step d2, round 7: configs/standup_v3_r7.yaml, warm-started from round 6's best policies
# (same seed, weights and normalization; action noise kept, std 0.5-1.1): the skill is
# there, it needs practice on the commands that matter. 1.5M steps (round 6 was flat from
# about 1M of 3M).

algorithm: ppo
task: standup_v3
env_config: configs/standup_v3_r7.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 1500000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 100
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/standup_round6_seed{seed}
init_checkpoint: best

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
  log_std_init: 0.0
