# v3 step d2, round 11: round 10 (configs/standup_v3_r10.yaml) with re-planning.
# Round 10 (87.3 % held-out, best so far, 0 tower hits): 39 of its 64 freezes were deadlocks,
# the turn's wrist or cube held by the shield 1.4 cm from the tower from about step 73 on.
# Change, set before any round-11 training: re-planning (StandUpConfig.replan): after 1 s with
# every move held, the hand backs away from the tower and the command becomes the turn the
# chooser rates best from there, among those not yet tried, at most 4 times an episode. On in
# training (the policy learns to go on from a re-plan) and in evaluation (part of the skill).
# Round 10's policies with it, no retraining, practice starts (200 x 3, seed 779): 90.2 %
# against 88.0 % (only re-planning 14, only not 1), no tower hits; tuned there (a longer back-
# off, an earlier trigger and a closer shield floor did not help).
# Training commands from round 10's 5 voting choosers (runs/choosers/standup_round10_pooled.pt).

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05
  strain: 0.15              # x rad of weld stretch beyond 20 deg, per step (40 deg: -0.05)
  strain_from: 0.35
  touch: 0.2                # per step the gripper touches the released cube
  hold: 0.01                # per step still holding (a whole episode: -3, below the -10s)
  shield: 0.05              # per step x the fraction the shield cut (whole episode: -15 max)

command:
  directions: 16
  level: 0.2
  tolerance: 1.05
  align: 2.0
  wrong_turn: 10.0
  sampler: chooser
  chooser: runs/choosers/standup_round10_pooled.pt  # 5 voting, round 10's outcomes
  top_k: 3
  explore: 0.2

shield:                     # the safety shield (StandUpConfig.shield)
  enabled: true
  min_gap: 0.015
  slide: true               # round 10

replan:                     # round 11 (StandUpConfig.replan)
  enabled: true
  stall: 20
  back: 12
  max_replans: 4

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
