# v3 step d1, round 5: configs/grasp_anypose5_cartesian.yaml (more cubes near the base and
# lying), warm-started from round 4's best policies (their own action noise and input
# normalization), 1M steps, learning rate 3e-4 -> 3e-5, 200 validation episodes.

algorithm: ppo
task: grasp_v4
env_config: configs/grasp_anypose5_cartesian.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 1000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 200
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/grasp_anypose4_seed{seed}
init_checkpoint: best

ppo:
  learning_rate: 0.0003
  learning_rate_final: 0.00003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
