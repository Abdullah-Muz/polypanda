# v4.0 door skill, dev round 3 (docs/v4_targets.md): configs/door_v1_r2.yaml plus a training
# margin on slams, committed before training. Round 2 (runs/door_v1_bc_ppo_r2_seed0) passed T1-T3
# on door_dev_v1 (398/400, every cell >= 90 %) but slammed on 12/400 opens (T4 allows 1 %), at
# 0.151-0.205 m/s against the allowed 0.15: it aims at the limit and noise carries it over (the
# stop's place varies by ~2 cm and is not observed). reward.slam_margin 0.03: the slam penalties
# are paid from 0.12 m/s (opening; 0.27 closing), so it learns to arrive below 0.12. Slams are
# still counted, in training stats, validation and evaluation, at the allowed speeds themselves.
action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 4
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 0.6
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

scene:
  station_angle: 0.0          # deg: the machine straight in front of the robot
  radius: 0.5                 # m: the cell's standard station pose
  finger_stiffness: 1000.0    # N/m: the cell's gripper

variation:                    # drawn every episode (training and validation)
  slides: [right, left, out]
  travel_side: [0.12, 0.14]   # m (needed sideways: 0.115)
  travel_out: [0.265, 0.275]  # m (needed outward: 0.255; the arm reaches about 0.8 m out)
  friction: [0.2, 10.0]       # N, log-uniform (nominal 0.4)
  damping: [1.0, 10.0]        # N s/m, log-uniform (nominal 4)
  spring_prob: 0.5            # share of machines with a closing spring
  spring: [10.0, 40.0]        # N/m; a springy lid stays open only in its hold-open detent
  soft_close_speed: 0.2       # m/s: a springy lid's damper limits how fast it shuts itself
  handle_offset_side: 0.03    # m either way along the bar
  handle_offset_out: 0.01
  handle_shift_side: 0.02     # m either way along the slide
  handle_shift_out: 0.01
  handle_height: [0.025, 0.05]  # m, bar centre above the lid's top (nominal 0.035)
  latch_speed: [0.01, 0.1]    # m/s, log-uniform (nominal 0.02)
  position: 0.015             # m either way, each axis
  turn: 10.0                  # deg either way

start:
  open_prob: 0.5
  carry_height: 0.32
  jitter_xy: 0.02
  jitter_z: 0.02
  jitter_yaw: 0.17
  close_margin: 0.005

sensing:
  handle_bias: 0.001          # m per axis, once per episode (docs/pose_error.md)
  handle_noise: 0.0003        # m per axis per step
  occlusion_radius: 0.06
  bar_yaw_bias: 0.0087        # rad (0.5 deg)
  bar_yaw_noise: 0.0017
  observe_bar_yaw: true
  force_noise: 1.0            # N per axis per step
  force_clip: 100.0
  closed_switch: 0.002
  touch_release: 5            # steps off the bar before touch_travel restarts

gripper:
  close_above: 0.25
  open_below: -0.25
  speed: 0.1                  # m/s per finger
  chunk: 5

success:
  clear_height: 0.03
  hold_steps: 10

reward:
  approach: 10.0
  touch: 0.5
  progress: 10.0
  retreat: 20.0
  retreat_cap: 0.05
  success: 10.0
  force: 0.01
  force_limit: 40.0
  collision: 0.1
  slam: 20.0
  slam_open_speed: 0.15
  slam_close_speed: 0.3
  slam_hit: 2.0               # once per slam (round 2)
  slam_margin: 0.03           # m/s: penalties paid from 0.03 below the allowed (round 3)
  stop_press: 0.05
  stop_force: 25.0
  time: 0.005
  action: 0.001
  non_finite: 10.0

horizon: 300

focus:                        # training only (DoorConfig.for_evaluation drops it)
  prob: 0.2
  cells: [open/out/spring]
