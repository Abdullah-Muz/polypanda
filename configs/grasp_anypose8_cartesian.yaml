# v3.2 grasp round 2 (docs/v3_2_targets.md): round 1 (configs/grasp_anypose7_cartesian.yaml)
# with its two diagnosed faults addressed. Diagnosis of round 1 (brief Section 18, 2026-11-18):
#   - far/lying regression: the cell-like 20 % (F2+F3) came out of the whole pool, so lying
#     cubes fell from 69 to 57 % of training starts and far (x >= 0.45) lying ones from 29 to 24 %
#     (sampled; far placements overall did not drop, the belt cubes sit at x 0.5). This explains
#     the lying regression, not seed 2's far upright one (far upright exposure rose 0.12 -> 0.17).
#     Not the finger_top penalty (v3.1's successful far grasps rarely trigger it).
#   - seed 0's one-sided knock-overs near the base: the open hand descends ~2 cm outside and
#     1-3 cm to the side of the cube's centre, so a finger lands on the top edge. finger_top acts
#     only on contact; no policy turned the long way round.
# Changes (user approved 2026-11-18), warm-started from v3.1's grasp (grasp_anypose6) as round 1:
#   R1 reweighting, cell-like 20 % kept: lying_prob 0.7 -> 0.875 of the other 80 % (near_prob
#      stays 0.4), so lying (0.70), far lying (0.29), near lying (0.37) and far upright (0.12)
#      shares of training starts match v3.1
#   R2 reward.corridor 0.2 per step (margin 1 cm, 2 cm off-centre): v3.1's successful grasps cross
#      it ~1.3 steps per episode, its failures 33-70 steps (pre-check on near-base, lying, upright)
# Everything else as round 1.

action:
  max_delta: 0.015
  n_substeps: 25
  max_lead: null
  space: cartesian
  cartesian:
    dof: 4
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 0.6
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

placement:
  x_range: [0.30, 0.78]
  y_range: [-0.20, 0.20]
  near_prob: 0.4
  near_x: [0.30, 0.40]
  near_upright_prob: 0.12   # v3.2 F2: upright, near the base, straight ahead of the hand
  near_upright_y: [-0.02, 0.02]
  edge_prob: 0.5            # of those, turned 35-45 deg either way
  belt_prob: 0.08           # v3.2 F3: upright where the infeed delivers cubes
  belt_x: [0.485, 0.515]
  belt_y: [-0.015, 0.015]
  belt_yaw: 15.0

resting:
  lying_prob: 0.875         # R1, of the other episodes (round 1: 0.7)
  max_lying_turn: 0.52
  lying_gate_z_below: 0.015

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

gate:
  xy_tol: 0.01
  z_tol: 0.01
  align_tol: 0.15
  tilt_tol: 0.15
  dwell_steps: 2
  reopen_gap: 0.02
  reopen_steps: 10

episode:
  horizon: 300
  max_cube_tilt: 1.047

success:
  lift: 0.05

reward:
  approach: 20.0
  align: 1.0
  lift: 20.0
  lift_cap: 0.10
  hold: 0.5
  action: 0.005
  gripper_tilt: 0.1
  floor: 0.1
  knocked_over: 5.0
  finger_top: 0.2           # v3.2 F3: per step a finger touches the cube's top while open
  corridor: 0.2             # R2: per step the open hand is low beside the cube
  corridor_margin: 0.01
  corridor_xy: 0.02

curriculum:
  pregrasp_start_prob: 0.3
  preclose_start_prob: 0.2

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]
  size_scale: [0.85, 1.15]
  large_prob: 0.15          # v3.2 F4: size from large_scale instead
  large_scale: [1.05, 1.15]

check:
  min_lift: 0.02
  window: 5
  max_slip: 0.002
  max_slip_rot: 0.05
