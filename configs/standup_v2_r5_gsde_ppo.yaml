# v3 step d2, round 5: round 4's training (configs/standup_v2_demo_ppo.yaml) on
# configs/standup_v2_r5.yaml, with state-dependent exploration (gSDE). Round 4's per-step
# Gaussian noise (std still about 0.9 at 2M steps) averages out over the ~20 steps a turn
# takes, so the policies never tried turning the other way round the tower. gSDE noise is a
# function of the state, held for sde_sample_freq steps (longer than a turn).
# log_std_init -3 (std per latent feature): held noise adds up over steps, so it is matched on
# how far it carries the untrained hand, not on its per-step size. Measured over 20 steps:
# round 4 4.3 cm; gSDE -2 21 cm (a first launch at -2 made no progress: validation 0 % at 200k
# on all seeds, runs/aborted/standup_round5_lsi-2_*); gSDE -3 9.3 cm, about 2x round 4.
# SET ASIDE (user decision): at -3 it still learned far slower than round 4. At 300k
# validation 0 % on all seeds (round 4 at 400k: 43 %); at 250k no cube was ever low and
# upright on 40 fresh starts per seed (the 1.5 cm gate was not the block). Stopped at about
# 300k; runs/aborted/standup_round5_gsde-3_*. Round 5 uses configs/standup_v2_r5_ppo.yaml.

algorithm: ppo
task: standup_v2
env_config: configs/standup_v2_r5.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 100
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
  log_std_init: -3.0
  use_sde: true
  sde_sample_freq: 32
