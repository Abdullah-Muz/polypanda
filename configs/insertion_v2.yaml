# v4.1 learned insertion, round 2's env (docs/v4_1_insertion_r1_rca.md, "Round 2"; docs/
# insertion_env.md, "Round 2"). The targets' task, unchanged: the same episode distribution,
# sensing, success definition (the 50 N damage limit checked every physics step), start for
# evaluation and validation (InsertionConfig.for_evaluation turns the curriculum off), budget and
# observation; round 1's env is configs/insertion_v1.yaml (every round-2 option off).
# What round 2 changes, against round 1's root causes:
# - the release interlock (action.release_window): a release lets go only with the module's
#   bottom within 3 mm of the nest's floor (well inside the 15 mm pocket); elsewhere it is ignored
#   and unpenalised (release_unseated 0). Round 1's untrained policy let go after ~12 steps from
#   25 cm (median 297 N on the nest). The policy still chooses when to let go near the floor.
# - the compliant action layer (compliance): the learned skill's controller is an admittance on
#   the hand target, as industrial insertion uses (IndustReal, FORGE). Round 1's stiff arm held
#   30-50 N wherever its target ran into the rim.
# - the start-height curriculum (curriculum, training only; IndustReal's sampling-based one).
# - the reward: potential-based progress on 4 keypoints, force penalty from 15 N, smaller time
#   penalty (see "reward").
variation:                    # docs/v4_1_targets.md, "The episode distribution" (unchanged)
  testers: [TA, TB, TC]
  clearance: [0.00025, 0.0005]
  chamfer: [0.0005, 0.001]
  position: 0.015
  turn: 10.0
  camera_xy: 0.0008
  camera_xy_clip: 0.003
  camera_yaw: 0.5
  camera_yaw_clip: 2.0
  pick_lateral: 0.003
  pick_yaw: 5.0

action:
  max_step: 0.01              # m per step per axis (unchanged)
  max_rot: 0.05
  max_lead: 0.03
  max_turn: 0.35
  release_above: 0.0          # (after pilot 3; round 1: 0.5) the threshold at the action's
  #                             midpoint, as Isaac Lab and robosuite set their grippers'. At 0.5
  #                             pilot 3's mean release while seated was 0.045 (p90 0.25): 20/20
  #                             seated, 0 released, deterministic
  release_window: 0.003       # m: the interlock (the module's bottom this close to the floor)
  release_retract: true       # release-and-retract (user, 2026-11-26, after the first pilot): a
  #                             release that takes effect opens the fingers and retracts the hand
  #                             to the carry height as one built-in motion, the cell's own (as the
  #                             search's retreat), and the episode ends, judged as always. The
  #                             first pilot's policy, pressing down, kept pressing with the open
  #                             hand after a release and drove the fingers into the freed module
  #                             (8 of 12 stochastic releases ended in damage), so it learned never
  #                             to let go

compliance:
  enabled: true
  contact_force: 2.0          # N: in contact (the sensor's noise is 0.1 N; the module's own
  #                             weight is carried by the grasp, not felt here)
  force: 10.0                 # N: above this the target backs off (the search presses 3-15 N)
  gain: 0.00005               # m per N per step: x ~13 N/mm contact stiffness = 0.65 < 2 (stable)
  max_backoff: 0.001          # m per step
  lead: 0.001                 # m: the target's largest lead into a contact (~13 N at ~13 N/mm)
  approach_zone: 0.015        # m above the rim (and inside): the slow zone (the gate: touching
  #                             down at round 1's 0.2 m/s gave 35-80 N before any layer could act)
  approach_lead: 0.003        # m: the target within this of the rest target there (~30 mm/s)
  sense: robot                # comply with the external force (and its twist about the TCP) on
  #                             the arm and the module (the Panda's joint-torque estimate), not
  #                             the module's alone: the gate's noise near the nest pushed the hand
  #                             into the testers' roofs with hundreds of N
  torque_contact: 0.2         # N m: twisted by a contact (the wrist is very stiff in yaw)
  torque: 0.5                 # N m: above this the yaw target backs off
  rot_gain: 0.0002            # rad per N m per step (x the wrist's ~2000 N m/rad = 0.4 < 2)
  max_rot_backoff: 0.005      # rad per step
  yaw_lead: 0.0005            # rad: the yaw target's largest lead into a twist (~1 N m)
  reflex_force: 20.0          # N across the insertion axis (axis_split), between control steps
  reflex_torque: 3.0          # N m: (every physics step of a policy's step) a force, twist or
  reflex_z_force: 35.0        # N along the axis above these holds the arm where it is until
  reflex_every: 1             # the next control step (the layer itself acts at 20 Hz; a contact
  #                             met at speed otherwise builds up for 50 ms: the gate's noise
  #                             reached 100-300 N on the testers' roofs)
  axis_split: true            # (after pilot 2) the admittance acts across the insertion axis
  #                             (x, y, yaw); along it the policy may always push, force-limited:
  #                             pilot 2's policy rubbed the nest's walls while pushing down, the
  #                             whole-force layer backed off along the walls' push and its 12 N
  #                             reflex held the arm, and the module stalled 7 mm over the floor
  z_force: 15.0               # N: the target stops advancing into a vertical contact (no back-off)
  z_backoff_force: 30.0       # N: it backs off only above this (the damage limit is 50 N)

curriculum:
  enabled: true
  mode: reverse               # (after pilot 2) a reverse curriculum, Florensa et al. 2017. Pilot 2:
  #                             with IndustReal's rule (uniform from `low` to the carry start) only
  #                             ~5 % of episodes started near the nest, success stayed under 80 %,
  #                             so `low` sat at -8 mm for 900k steps and the range never moved
  low: -0.008                 # m: the deepest start, fixed: 8 mm inside the rim, 7 mm over the
  #                             floor, engaged (the rib, 12 mm tall, stays in its slot)
  high: 0.005                 # m: the first highest start, 5 mm over the rim
  high_min: 0.005             # m: it never shrinks below this
  grow: 1.5                   # x when the curriculum episodes' success > raise_above, / below
  #                             lower_below: from 5 mm to the carry start (~190-250 mm) in ~9 raises
  raise_above: 0.7
  lower_below: 0.2
  carry_share: 0.15           # of the episodes start at the carry start itself (the approach
  #                             practised from the first update; logged apart, not in the rule)
  window: 100                 # curriculum episodes per decision (all 8 envs)
  low_min: -0.008             # (industreal mode only)
  step_up: 0.005              # (industreal mode only)
  step_down: 0.003            # (industreal mode only)

sensing:
  force_noise: 0.1
  torque_noise: 0.002

success:                      # the targets' (unchanged)
  floor_gap: 0.001
  tilt: 2.0
  slack: 0.0002
  force_limit: 50.0
  carry_margin: 0.01

reward:
  # the held progress term: keypoint_scale x the change of phi(d) = sum w_i (1 - tanh(d / s_i))
  # on the module's 4 bottom corners' mean distance d to their seated places (+5.9 from the
  # carry height to 2 mm over the floor, +5.0 for the last 2 mm, +11 in all): potential-based,
  # so moving away costs what moving in earned. (Before pilot 3: keypoints_best, paid on new
  # bests only, so that untrained noise near the nest was not charged ~1.5 for d's outward
  # drift. Pilot 2 showed the price: leaving the nest cost nothing, and its policy learned to
  # pull out and drift away (mean dz +0.1, dx -0.1 per step from 8 mm inside; 1 of 12 succeed).)
  progress: keypoints
  keypoint_scale: 1.0
  keypoint_scales: [0.1, 0.03, 0.001]   # m: the 25 cm approach, the last 3 cm onto the rim, the last mm
  keypoint_weights: [4.0, 2.0, 5.0]     # (the gate: touching down from 2 cm over the rim earns ~+1.5)
  insert_z: 10.0              # (unused with progress: keypoints)
  insert_xy: 100.0            # (unused)
  seat: 3.0                   # unchanged
  release_seated: 1.0         # unchanged
  release_unseated: 0.0       # round 1: 2.0; the interlock makes an early release a no-op
  retreat: 5.0                # unchanged
  success: 10.0               # unchanged
  force: 0.02                 # per N per step above force_soft (round 1: 0.05)
  force_soft: 20.0            # N (round 1: 20; the plan's 15 N, changed by the gate): sustained
  #                             pressing is capped near 12 N by the reflex, so the penalty only
  #                             charges impacts (physics-step peaks); from 15 N it charged untrained
  #                             noise near the nest for its 15-25 N touches (-0.5, below hovering)
  damage: 10.0                # unchanged; the episode ends
  failure: 5.0                # unchanged
  collision: 0.02             # per N per step of the arm's push on the tester above force_soft
  collision_force: true       # (round 1: -0.05 per step of any touch). The gate: untrained noise
  #                             started near the nest brushes the testers' roofs and walls with
  #                             the hand for ~240 steps (-12 at round 1's rate): touching is not
  #                             damage, pushing is, as for the module's own force
  time: 0.005                 # per step (round 1: 0.01): -3 over the 600-step budget
  action: 0.0002              # x |hand action|^2 (round 1: 0.001; -0.1 of noise per episode at
  #                             round 2's std 0.2, now -0.02)
  seated_wait: 0.03           # (after pilot 3) per step seated and still held: seated, the
  #                             potential is flat and nothing pushed the release's mean up. 1 s
  #                             seated costs 0.6 against the release's +1 and the success's +10;
  #                             it accrues only while seated, so a release before seating gains
  #                             nothing from it (and loses the last mm's potential)
  non_finite: 10.0

start:
  carry_height: 0.32
  settle_steps: 10

horizon: 600                  # 30 s at 20 Hz
pick_pool: data/handoff/insertion_picks_train_v1.json
