# v4.0 door skill, dev round 4 (docs/v4_targets.md; approved 2026-11-24): PPO on task door_v2
# (round 3's env plus the door-open switch, configs/door_v2_r4.yaml), warm-started from round 3's
# best checkpoint (runs/door_v1_bc_ppo_r3_seed{seed}, as each round starts from the previous
# round's best) with the new input padded in at zero weight (init_pad_obs), so training starts
# from round 3's behaviour. Otherwise as round 3: lr 5e-5 -> 1e-5, 2M steps, validation on the
# same 200 episodes every 100k steps, per cell. The seed's policy = this run's FINAL checkpoint.
algorithm: ppo
task: door_v2
env_config: configs/door_v2_r4.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 200
eval_seed: 100000
eval_fixed_episodes: true
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/door_v1_bc_ppo_r3_seed{seed}
init_checkpoint: best
init_pad_obs: 1

ppo:
  learning_rate: 0.00005
  learning_rate_final: 0.00001
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  log_std_init: 0.0
