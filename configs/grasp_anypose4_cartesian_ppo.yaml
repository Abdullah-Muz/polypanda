# v3 step d1, round 4: round 3 (configs/grasp_anypose3_cartesian_ppo.yaml: warm start from
# grasp_cart with input renormalization) on the task in the workcell's gripper physics
# (configs/grasp_anypose4_cartesian.yaml). Training settings unchanged.

algorithm: ppo
task: grasp_v4
env_config: configs/grasp_anypose4_cartesian.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 100
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/grasp_cart_seed{seed}
init_checkpoint: best
init_log_std: -0.5
init_renormalize_steps: 20000

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
