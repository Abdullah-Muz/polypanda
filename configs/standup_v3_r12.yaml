# v3.1 skill round, stand-up round 12 (docs/v3_1_targets.md): round 11
# (configs/standup_v3_r11.yaml) with cube size randomized (v3.0's size robustness: 77.3 %
# against 90.0 % nominal) and starts from real hand-offs: 30 % of training episodes hold the
# cube as the learned lying-cube grasp hands it over in the cell (scripts/
# make_standup_handoffs.py, v3.1's locked grasp grasp_anypose6, 3 seeds; amended 2026-11-15
# before training, from v3.0's grasp), instead of the synthetic grip.
# Changes, set before any v3.1 training: randomization.size_scale [0.85, 1.15],
# start.handoff_prob 0.3; everything else as round 11.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]
  handoff_prob: 0.3        # v3.1 r12: grips the learned grasp really hands over
  handoffs: [data/handoff/standup_handoffs_grasp_anypose6_seed0.npz,
             data/handoff/standup_handoffs_grasp_anypose6_seed1.npz,
             data/handoff/standup_handoffs_grasp_anypose6_seed2.npz]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05
  strain: 0.15              # x rad of weld stretch beyond 20 deg, per step (40 deg: -0.05)
  strain_from: 0.35
  touch: 0.2                # per step the gripper touches the released cube
  hold: 0.01                # per step still holding (a whole episode: -3, below the -10s)
  shield: 0.05              # per step x the fraction the shield cut (whole episode: -15 max)

command:
  directions: 16
  level: 0.2
  tolerance: 1.05
  align: 2.0
  wrong_turn: 10.0
  sampler: chooser
  chooser: runs/choosers/standup_round10_pooled.pt  # 5 voting, round 10's outcomes
  top_k: 3
  explore: 0.2

shield:                     # the safety shield (StandUpConfig.shield)
  enabled: true
  min_gap: 0.015
  slide: true               # round 10

replan:                     # round 11 (StandUpConfig.replan)
  enabled: true
  stall: 20
  back: 12
  max_replans: 4

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]
  size_scale: [0.85, 1.15]  # v3.1 r12: cube size (constant density)

horizon: 300
topple_tilt: 0.785
