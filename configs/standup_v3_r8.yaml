# v3 step d2, round 8: round 7 (configs/standup_v3_r7.yaml), the loop closed once more.
# Round 7 reached 85.7 % held-out with its turn chooser (best so far; target 90 %, scripted
# 93.0 %): its policies' best possible on practice starts rose to 91-93 % (round 6: 85-92),
# freezes fell to 19 of 600 and tower hits (54) are the main failure. Change, set before any
# round-8 training: the training commands are drawn from the top 3 of 5 voting choosers fitted
# on all three round-7 seeds' outcomes (scripts/fit_turn_chooser.py --ensemble 5 ->
# runs/choosers/standup_round7_pooled.pt), as round 6's chooser went stale for round 7.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05
  strain: 0.15              # x rad of weld stretch beyond 20 deg, per step (40 deg: -0.05)
  strain_from: 0.35
  touch: 0.2                # per step the gripper touches the released cube
  hold: 0.01                # per step still holding (a whole episode: -3, below the -10s)

command:
  directions: 16
  level: 0.2
  tolerance: 1.05
  align: 2.0
  wrong_turn: 10.0
  sampler: chooser
  chooser: runs/choosers/standup_round7_pooled.pt   # round 8: 5 voting, round 7's outcomes
  top_k: 3
  explore: 0.2

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
