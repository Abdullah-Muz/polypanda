# v3 step d2, round 5: round 4 (configs/standup_v2_demo.yaml) with two task changes from the
# round-4 root-cause analysis (81.8 % held-out, target 90 %, scripted 93.0 %):
# - gate.xy_tol 3 -> 1.5 cm. The release gate was as loose as the success check (3 cm): the
#   policies released at its edge (2.5-3.0 cm, 10-14 deg tilt), the cube rocked upright 0.3-1 cm
#   further out and missed (all 16 not_stood). The gate now leaves room for that settling. The
#   success check (check.tolerance 3 cm) and the evaluation sets are unchanged.
# - reward.clearance_margin 5 -> 15 cm. Each policy turned the hand one fixed way whatever the
#   tower; with the tower behind the wrist it hit it (43 of 47 hits) or froze in front of it.
#   The wrist closes on the tower at 1.5-2.5 cm per step, so a 5 cm margin warned 2-3 steps
#   ahead, after the turn direction was set. Potential-based, so it shapes learning without
#   changing which behaviour is best.
# Exploration changes are in configs/standup_v2_r5_ppo.yaml. Set before any round-5 training.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.015             # round 5 (was 0.03, equal to check.tolerance)
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.15    # round 5 (was 0.05)

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
