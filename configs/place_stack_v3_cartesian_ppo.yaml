# Milestone 9: PPO on the stacking place v3 (configs/place_stack_v3_cartesian.yaml: aim at the
# stack, 1 cm placements, centring reward, softer nudge penalty). Same PPO settings and budget
# as v1 and v2 (configs/place_stack_cartesian_ppo.yaml).

algorithm: ppo
task: place
env_config: configs/place_stack_v3_cartesian.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 120        # 20 per tower height on average
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1          # several runs in parallel

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
