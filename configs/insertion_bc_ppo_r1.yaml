# v4.1 learned insertion, dev round 1 (docs/v4_1_targets.md, Part I; at most 3 rounds): PPO on
# task insertion (configs/insertion_v1.yaml: the targets' distribution, grasps from the training
# pick pool), warm-started from the seed's clone of the frozen search (runs/insertion_bc_r1_seed
# {seed}; configs/insertion_bc_r1.yaml). As v4.0's door round 1 (clone -> PPO,
# configs/door_v1_bc_ppo.yaml), with these choices:
# - 2M steps (v4.0's rounds 2-5 length; round 1 was 3M from a clone that could not let go; the
#   search's clone does release, it is the search's own last step).
# - lr 1e-4 -> 1e-5: v4.0's clone -> PPO rate, lower than from scratch so PPO keeps what the clone
#   does well.
# - Exploration: the clone's own action noise, kept (no init_log_std): log std -3 on the hand's
#   moves and turn (std 0.05 of full scale: 0.5 mm and 0.0025 rad per step) and -1 on the release
#   (std 0.37, v4.0's). Actions are hand-target moves of up to 10 mm per step and the target
#   integrates them, so v4.0's door noise on the hand (std 0.37: 3.7 mm per step) would
#   random-walk the module centimetres off the nest within an episode against 0.25-0.5 mm of
#   clearance; the release needs enough noise to be tried at all (configs/insertion_bc_r1.yaml
#   explains both numbers).
# - ent_coef 0 (the door's was 0.005): an entropy bonus pushes every log std up at a constant
#   rate, and here a larger noise mainly breaks the 50 N limit; PPO sets the noise from the
#   returns alone.
# - Validation: the same 200 episodes every 100k steps (eval_seed 100000: gymnasium's plain
#   seeded stream, as training's, never an insertion set's spawn-keyed stream), per tester, with
#   damage episodes and success by clearance and camera error (training/fixed_eval.py).
# The seed's policy = this run's FINAL checkpoint (if it is the last round).
algorithm: ppo
task: insertion
env_config: configs/insertion_v1.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 200
eval_seed: 100000
eval_fixed_episodes: true
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/insertion_bc_r1_seed{seed}
init_checkpoint: final

ppo:
  learning_rate: 0.0001
  learning_rate_final: 0.00001
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  log_std_init: 0.0           # (replaced by the clone's at the warm start)
