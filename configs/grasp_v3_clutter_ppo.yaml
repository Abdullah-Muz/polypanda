# Milestone 7.3: PPO on GraspV3Env (committed yaw, wide region, up to two distractor cubes).
# Identical to configs/grasp_v2_wide_ppo.yaml except the task (grasp_v3) and its configuration.

algorithm: ppo
task: grasp_v3
env_config: configs/grasp_v3_clutter_curriculum.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 1000000
normalize_obs: true
normalize_reward: true
eval_freq: 50000
eval_episodes: 30
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1          # 3 seeds run in parallel (see configs/grasp_v2_ppo.yaml)

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
