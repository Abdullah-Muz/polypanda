# v3 step d2, round 9: round 8 (configs/standup_v3_r8.yaml) with a safety shield.
# Rounds 7-8 plateaued (85.7 / 83.5 % held-out; target 90 %, scripted 93.0 %). Offline, every
# learned chooser variant picked a command that stood 85.7-87.1 % of the time on held-out
# practice starts (geometric input features did not help): no single command is reliable
# enough, mostly because the arm or the held cube brushes the tower (54 / 57 hits of 600).
# Change, set before any round-9 training: the shield (StandUpV3Env._actuate) refuses steps
# that would bring the arm or the held cube within 1.5 cm of the tower, retrying the step at
# 1/2, 1/4 and 0 of the action. On in training and in evaluation (it is part of the skill).
# Round 7's policies with it and no retraining, on 40 fresh starts: no tower hits, but as many
# freezes instead (the policy pushes into it): retraining should teach it to go round.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05
  strain: 0.15              # x rad of weld stretch beyond 20 deg, per step (40 deg: -0.05)
  strain_from: 0.35
  touch: 0.2                # per step the gripper touches the released cube
  hold: 0.01                # per step still holding (a whole episode: -3, below the -10s)

command:
  directions: 16
  level: 0.2
  tolerance: 1.05
  align: 2.0
  wrong_turn: 10.0
  sampler: chooser
  chooser: runs/choosers/standup_round7_pooled.pt   # round 8: 5 voting, round 7's outcomes
  top_k: 3
  explore: 0.2

shield:                     # round 9: the safety shield (StandUpConfig.shield)
  enabled: true
  min_gap: 0.015

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
