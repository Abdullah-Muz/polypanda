# v3 step d1, round 4: the any-pose grasp (GraspV4Env) in the workcell's gripper physics. Rounds
# 1-3 trained in the pick scene's Menagerie gripper (about 2 N squeeze, no torsional friction),
# where a lying cube held across its width swings in the fingers when lifted: a straight
# full-speed lift from a pregrasp start held 3/25 lying cubes (22/25 in the workcell's gripper),
# the grasp check never confirmed a swinging cube, and swings past resting.max_lying_turn ended
# the episode as knocked over. Round 3 seeds 0/1 learned no lying cube; seed 2 about 40 %.
# Changes (set before any round-4 training): `gripper` as the workcell's (where the skill runs),
# and the grasp check measures a lying cube's lift from its own resting height. Otherwise round
# 2's task (configs/grasp_anypose2_cartesian.yaml).

action:
  max_delta: 0.015
  n_substeps: 25
  max_lead: null
  space: cartesian
  cartesian:
    dof: 4
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 0.6
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

placement:
  x_range: [0.30, 0.78]
  y_range: [-0.20, 0.20]

resting:
  lying_prob: 0.6
  max_lying_turn: 0.52
  lying_gate_z_below: 0.015

gripper:                    # round 4: as simulation.workcell.WorkcellConfig
  finger_stiffness: 1000.0
  torsional_friction: true

gate:
  xy_tol: 0.01
  z_tol: 0.01
  align_tol: 0.15
  tilt_tol: 0.15
  dwell_steps: 2
  reopen_gap: 0.02
  reopen_steps: 10

episode:
  horizon: 300
  max_cube_tilt: 1.047

success:
  lift: 0.05

reward:
  approach: 20.0
  align: 1.0
  lift: 20.0
  lift_cap: 0.10
  hold: 0.5
  action: 0.005
  gripper_tilt: 0.1
  floor: 0.1
  knocked_over: 5.0

curriculum:               # training only; validation and evaluation start every episode from home
  pregrasp_start_prob: 0.3
  preclose_start_prob: 0.2

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

check:
  min_lift: 0.02
  window: 5
  max_slip: 0.002
  max_slip_rot: 0.05
