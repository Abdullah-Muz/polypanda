# v4.0 door skill, dev round 3 (docs/v4_targets.md): PPO warm-started from round 2
# (runs/door_v1_bc_ppo_r2_seed{seed}, best = 700k) on configs/door_v1_r3.yaml (round 2's env plus a
# training margin on slams: penalties from 0.12 m/s at the open stop, counted at 0.15). Otherwise
# as round 2: its own action noise, lr 5e-5 -> 1e-5, 2M steps, validation on the same 200
# episodes every 100k steps, per cell (eval/cells.jsonl).

algorithm: ppo
task: door
env_config: configs/door_v1_r3.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 200
eval_seed: 100000
eval_fixed_episodes: true
checkpoint_freq: 250000
torch_threads: 1
init_from: runs/door_v1_bc_ppo_r2_seed{seed}
init_checkpoint: best

ppo:
  learning_rate: 0.00005
  learning_rate_final: 0.00001
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  log_std_init: 0.0
