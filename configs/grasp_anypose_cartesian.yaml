# v3 step d1: the any-pose grasp (GraspV4Env), for recovery in the work-order cell. Knocked cubes
# mostly come to rest lying on a side, 0.30-0.78 m from the base (scripts/disturbance_ceiling.py).
# Identical to configs/grasp_cartesian_curriculum.yaml (the hand-motion grasp, grasp_cart) except:
# a wider placement region, lying cubes (resting), and training-only randomization of the cube's
# mass and friction. Keys map to polypanda.environments.grasp.GraspConfig.

action:
  max_delta: 0.015        # (joint actions only)
  n_substeps: 25
  max_lead: null          # (joint actions only)
  space: cartesian
  cartesian:
    dof: 4                # x, y, z and wrist yaw; the gripper is kept pointing straight down
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 0.6         # (6-D only)
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

placement:                # where knocked cubes land, in the station frame (grasp_cart: 0.35-0.65)
  x_range: [0.30, 0.78]
  y_range: [-0.20, 0.20]

resting:
  lying_prob: 0.6         # of randomly placed episodes (training and validation)
  max_lying_turn: 0.52    # rad out of horizontal: a lying cube tipped further is knocked

gate:
  xy_tol: 0.01
  z_tol: 0.01
  align_tol: 0.15         # rad; for a lying cube, to the direction across its long axis
  tilt_tol: 0.15
  dwell_steps: 2
  reopen_gap: 0.02
  reopen_steps: 10

episode:
  horizon: 300
  max_cube_tilt: 1.047    # (upright cubes)

success:
  lift: 0.05              # m above the cube's own resting height, with the verified grasp

reward:
  approach: 20.0
  align: 1.0
  lift: 20.0
  lift_cap: 0.10
  hold: 0.5
  action: 0.005
  gripper_tilt: 0.1
  floor: 0.1
  knocked_over: 5.0

curriculum:
  pregrasp_start_prob: 0.3  # lying cubes start gripped across their width

randomization:            # training only (B3-light); validation and evaluation use the nominal cube
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

check:
  min_lift: 0.02
  window: 5
  max_slip: 0.002
  max_slip_rot: 0.05
