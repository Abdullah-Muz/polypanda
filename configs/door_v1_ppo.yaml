# v4.0 door skill, v1 (docs/door_env.md): PPO from scratch on configs/door_v1.yaml, 3M steps.
# A first, plain RL run for reference; the plan (docs/v4_plan.md, 3.3) is to start from the
# scripted expert's demonstrations (control/scripted_door.py), which this config does not do yet.
# Validation: 200 episodes every 100k steps (both commands, randomized machines).

algorithm: ppo
task: door
env_config: configs/door_v1.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 3000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 200
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1

ppo:
  learning_rate: 0.0003
  learning_rate_final: 0.00003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [256, 256]
  log_std_init: 0.0
