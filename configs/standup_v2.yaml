# v3 step d2, round 3: the stand-up task of configs/standup_v1.yaml, run in StandUpV2Env (task
# standup_v2), which also observes the arm's and cube's clearance from the tower. Round 2 stood
# every cube up with no tower near but hit the tower in about a quarter of the episodes with
# one, mostly mid-turn. Changes (set before any round-3 training): the clearance observation
# (env) and reward.clearance shaping. Task, gate, success and evaluation sets unchanged.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0            # round 3: closing to contact from 5 cm costs 2 (given back on leaving)
  clearance_margin: 0.05

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
