# v3 step d2, round 6: StandUpV3Env (task standup_v3), the turn direction commanded.
# Root-cause analysis of rounds 2-5 (2026-10-28; Master Brief, Section 18):
# - every policy turned the hand one fixed way, the way reachable from the carry posture in
#   198 of 200 starts (the mirror way: 96), and hit towers behind its wrist; tower episodes
#   on the far side of the wrist succeeded at 91-96 % for the best seeds. The scripted
#   stand-up held to that one direction scores 77.5 % (free: 93 %);
# - round 5's release gate (1.5 cm) and clearance margin (15 cm) made it worse: back to
#   round 4's (3 cm, 5 cm).
# Changes from round 4 (configs/standup_v2_demo.yaml), set before any round-6 training:
# - command: the policy observes the direction to turn to; training draws it among the
#   reachable ones; wrong turns end the episode; potential-based shaping toward it; the
#   demonstration starts turn the commanded way; in use the critic picks the command;
# - reward.strain / touch / hold (robot-safety terms, see StandUpRewardConfig).

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05
  strain: 0.15              # x rad of weld stretch beyond 20 deg, per step (40 deg: -0.05)
  strain_from: 0.35
  touch: 0.2                # per step the gripper touches the released cube
  hold: 0.01                # per step still holding (a whole episode: -3, below the -10s)

command:
  directions: 16
  level: 0.5
  tolerance: 0.785
  align: 2.0
  wrong_turn: 10.0

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
