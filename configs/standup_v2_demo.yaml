# v3 step d2, round 4: round 3 (configs/standup_v2.yaml: StandUpV2Env, task standup_v2, with
# the tower clearance) plus starts from demonstration states. Round 3 reached 82.7 % held-out
# (target 90 %; scripted 93.0 %): 94.9 % with no tower near, 79.7 % with one, 70 of its 104
# failures tower hits. The scripted stand-up plans around the tower; here it acts for a random
# 0-120 steps at the start of 30 % of the carry-posture training episodes before the policy
# takes over, so the policy meets the turn near the tower and the descent far more often. Pure
# RL: reward is still the only learning signal (no imitation loss). Changes (set before any
# round-4 training): start.demo_prob and start.demo_steps. Everything else as round 3.

action:
  space: cartesian
  n_substeps: 25
  cartesian:
    dof: 6
    max_step: 0.01
    max_rot: 0.05
    max_tilt: 1.75
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02

start:
  radius: [0.32, 0.62]
  angle: [-0.44, 0.44]
  carry_height: 0.32
  grip_offset: 0.01
  grip_z: [-0.005, 0.01]
  helpful_prob: 0.3
  demo_prob: 0.3            # round 4: of the other (carry-posture) training episodes
  demo_steps: [0, 120]

tower:
  prob: 0.8
  distance: [0.20, 0.26]
  min_radius: 0.30
  max_cubes: 4

gate:
  max_tilt: 0.26
  max_drop: 0.025
  xy_tol: 0.03
  dwell_steps: 2

check:
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.03
  max_speed: 0.01
  window: 10

reward:
  clearance: 2.0
  clearance_margin: 0.05

gripper:
  finger_stiffness: 1000.0
  torsional_friction: true

randomization:
  mass_scale: [0.7, 1.4]
  friction_scale: [0.7, 1.3]

horizon: 300
topple_tilt: 0.785
