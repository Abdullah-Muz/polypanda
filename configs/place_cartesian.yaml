# Milestone 8: PlaceEnv (task v2, observes the cube's up axis) with Cartesian (hand-motion)
# actions, for the first learned place. Keys map to polypanda.environments.place.PlaceConfig;
# apart from the action block and reward.cube_tilt, every value is the scripted place's default.

action:                   # hand-motion actions; IK turns them into joint targets
  max_delta: 0.015        # (joint actions only)
  n_substeps: 25
  max_lead: null          # (joint actions only)
  space: cartesian
  cartesian:
    dof: 6                # x, y, z and rotation: standing a tilted cube upright needs the hand
                          # to tilt (the scripted place's upright correction)
    max_step: 0.01        # m per policy step per axis (0.2 m/s)
    max_rot: 0.05         # rad per policy step per axis
    max_tilt: 0.6         # rad: the hand stays within ~34 deg of pointing down
    max_lead: 0.03
    box_low: [0.15, -0.5, 0.01]
    box_high: [0.85, 0.5, 0.6]
    ik_iters: 2
    posture_gain: 0.02
  bound_penalty: 0.1      # outputs beyond +-1 cost 0.1 x excess^2 (transport lesson)

gate:                     # the fingers open once the cube is low and over the target
  release_height: 0.01
  xy_tol: 0.02

check:                    # verified placement
  max_rest_height: 0.003
  max_tilt: 0.1745
  tolerance: 0.02
  max_speed: 0.01
  window: 10

reward:
  progress: 20.0
  retreat: 5.0
  retreat_cap: 0.10
  placed: 0.5
  action: 0.005
  action_rate: 0.05
  gripper_tilt: 0.1
  floor: 0.1
  dropped: 5.0
  toppled: 5.0
  cube_tilt: 0.3          # per rad of cube tilt while held; larger than gripper_tilt (0.1), since
                          # righting the cube means tilting the hand

horizon: 120              # 6 s
drop_steps: 5
topple_tilt: 0.785
start_pool: data/handoff/place_train_v1.npz
