# v3 step d2, round 5: round 4's training (configs/standup_v2_demo_ppo.yaml, per-step Gaussian
# exploration) on configs/standup_v2_r5.yaml (release gate 1.5 cm, clearance margin 15 cm).
# State-dependent exploration (configs/standup_v2_r5_gsde_ppo.yaml) was tried first and set
# aside: it learned far slower (validation 0 % at 300k on all seeds).

algorithm: ppo
task: standup_v2
env_config: configs/standup_v2_r5.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 100
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
  log_std_init: 0.0
