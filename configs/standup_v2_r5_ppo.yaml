# v3 step d2, round 5: round 4's training (configs/standup_v2_demo_ppo.yaml) on
# configs/standup_v2_r5.yaml, with state-dependent exploration (gSDE). Round 4's per-step
# Gaussian noise (std still about 0.9 at 2M steps) averages out over the ~20 steps a turn
# takes, so the policies never tried turning the other way round the tower. gSDE noise is a
# function of the state, held for sde_sample_freq steps (longer than a turn). log_std_init -2
# is the usual gSDE start (std per latent feature; the action noise sums over the features).

algorithm: ppo
task: standup_v2
env_config: configs/standup_v2_r5.yaml
seed: 0
n_envs: 8
vec_env: subproc
total_timesteps: 2000000
normalize_obs: true
normalize_reward: true
eval_freq: 100000
eval_episodes: 100
eval_seed: 100000
checkpoint_freq: 250000
torch_threads: 1

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]
  log_std_init: -2.0
  use_sde: true
  sde_sample_freq: 32
